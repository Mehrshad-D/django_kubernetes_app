jobs:
  network_diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Install diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl mtr-tiny

      - name: Test registry connectivity
        run: |
          curl -v -IL --connect-timeout 15 https://hub.hamdocker.ir/ || true
          curl -v -IL --connect-timeout 15 https://registry.hamdocker.ir/ || true
          mtr -nT -r -c 7 hub.hamdocker.ir || true
          mtr -r -c 7 registry.hamdocker.ir || true
          
  darkube_build_django-github_dehghanimehrshad82-repo-test_hamravesh-c13:
    needs: network_diagnostics
    container:
      image: hamravesh/darkube-cli:v1.1
      options: --user root
    env:
      IMAGE_NAME: registry.hamdocker.ir/dehghanimehrshad82/django-github
    runs-on: ubuntu-latest
    steps:
    - name: checkout commit
      uses: actions/checkout@v4
    - name: darkube-cli build & push
      run: 'darkube build --push -t $IMAGE_NAME:${GITHUB_SHA:0:7} -t $IMAGE_NAME:${GITHUB_REF_NAME}
        --docker-auth-config ${{secrets.DOCKER_AUTH_CONFIG}} --workdir . --file ./Dockerfile
        --build-context . '
  darkube_deploy_django-github_dehghanimehrshad82-repo-test_hamravesh-c13:
    container: hamravesh/darkube-cli:v1.1
    needs: darkube_build_django-github_dehghanimehrshad82-repo-test_hamravesh-c13
    runs-on: ubuntu-latest
    steps:
    - name: darkube-cli deploy
      run: darkube deploy --token ${{secrets.DEPLOY_TOKEN_DJANGO_GITHUB_DEHGHANIMEHRSHAD82_REPO_TEST_HAMRAVESH_C13}}
        --app-id ${{secrets.APP_ID_DJANGO_GITHUB_DEHGHANIMEHRSHAD82_REPO_TEST_HAMRAVESH_C13}}
        --image-tag ${GITHUB_SHA:0:7} --job-id ${GITHUB_RUN_ID}
'on':
  push:
    branches:
    - main
